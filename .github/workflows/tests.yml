# 계산 모형·입력 화면 회귀 테스트
#
# main 푸시가 곧 Streamlit Cloud 재배포이므로, 배포 전에 pytest 가 반드시 돌아야 한다.
# tests/test_input_defaults.py 는 화면을 실제로 실행(AppTest)해 위젯 동작까지 확인한다.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
